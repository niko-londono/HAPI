<!doctype html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portafolio · Bolsa y Crypto | Apex Clearing</title>
  <meta name="description" content="Dashboard y resumen consolidado de inversiones en bolsa y crypto a partir de estados de cuenta mensuales de Apex y HAPI.">
  <meta name="theme-color" content="#090d16">

  <!-- Tipografías Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Estilos Maestros -->
  <link rel="stylesheet" href="MAESTRO.css">

  <!-- Dependencias de React 18 y Babel Standalone (v7 estable) para transpilar JSX en el navegador -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.4/babel.min.js"></script>
</head>
<body>
  <!-- Contenedor Raíz de React -->
  <div id="root">
    <div style="min-height: 80vh; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #94a3b8; font-family: 'Outfit', sans-serif;">
      <div style="width: 44px; height: 44px; border: 3px solid rgba(59, 130, 246, 0.2); border-top-color: #3b82f6; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 16px;"></div>
      <div style="font-size: 18px; font-weight: 600; color: #f1f5f9;">Cargando Portafolio HAPI...</div>
      <div style="font-size: 13px; margin-top: 6px; color: #64748b;">Inicializando motor de cálculo y componentes React</div>
    </div>
  </div>

  <!-- 1. Motor Maestro de Datos y Cálculos Financieros -->
  <script src="MAESTRO.js"></script>

  <!-- 2. Aplicación Maestra en React (JSX) -->
  <script type="text/babel" src="MAESTRO.jsx"></script>

  <!-- Script de detección para protocolo file:// con instrucciones en caso de bloqueo CORS local del navegador -->
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        const root = document.getElementById('root');
        // Si después de 2.5s no se ha montado React (común al abrir con doble click en file:// por política de seguridad del navegador)
        if (root && root.querySelector('.spin')) {
          if (window.location.protocol === 'file:') {
            root.innerHTML = `
              <div style="max-width: 620px; margin: 80px auto; padding: 30px; background: rgba(18, 24, 38, 0.9); border: 1px solid rgba(245, 158, 11, 0.4); border-radius: 16px; color: #f1f5f9; font-family: 'Inter', sans-serif; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
                <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 16px;">
                  <span style="font-size: 28px;">💡</span>
                  <h2 style="font-family: 'Outfit', sans-serif; margin: 0; font-size: 20px; color: #f59e0b;">Apertura local detectada (file://)</h2>
                </div>
                <p style="color: #94a3b8; font-size: 14px; line-height: 1.6; margin-bottom: 16px;">
                  Has abierto el archivo directamente desde tu explorador de archivos. Los navegadores modernos bloquean la lectura de archivos <code>.jsx</code> externos bajo <code>file:///</code> por seguridad CORS.
                </p>
                <div style="background: rgba(13, 19, 32, 0.85); padding: 14px 18px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.08); font-family: 'JetBrains Mono', monospace; font-size: 13px; margin-bottom: 16px;">
                  <div style="color: #64748b; margin-bottom: 6px;">// Para correr localmente abre la terminal en esta carpeta y ejecuta:</div>
                  <div style="color: #38bdf8;">npx serve .</div>
                  <div style="color: #64748b; margin-top: 8px; margin-bottom: 6px;">// O si tienes la extensión Live Server de VS Code / IDE:</div>
                  <div style="color: #10b981;">Clic derecho en index.html → "Open with Live Server"</div>
                </div>
                <p style="color: #94a3b8; font-size: 13px; line-height: 1.5; margin: 0;">
                  En despliegues web como <b>Vercel</b> o en cualquier servidor HTTP local, la aplicación carga automáticamente sin ninguna configuración adicional.
                </p>
              </div>
            `;
          }
        }
      }, 2500);
    });
  </script>
</body>
</html>
