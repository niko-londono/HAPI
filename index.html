<!doctype html>
<html lang="es" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HAPI · Portafolio</title>
  <meta name="description" content="Resumen de inversiones en bolsa (Apex/HAPI) y crypto (Bakkt) a partir de los estados de cuenta mensuales.">
  <meta name="theme-color" content="#f7f6f3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#191918" media="(prefers-color-scheme: dark)">
  <meta property="og:type" content="website">
  <meta property="og:title" content="HAPI · Portafolio">
  <meta property="og:description" content="Resumen de inversiones en bolsa y crypto, mes a mes.">
  <meta property="og:locale" content="es_CO">
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=__BUILD__">
  <!-- El HTML siempre se revalida para que encuentre la versión nueva de los archivos -->
  <meta http-equiv="Cache-Control" content="no-cache">
  <meta name="hapi-build" content="__BUILD__">

  <!-- Tema antes de pintar (Auto sigue al sistema; evita parpadeo) -->
  <script>
    try {
      var pref = localStorage.getItem('hapi_theme') || 'system';
      var dark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    } catch (e) {}
  </script>

  <!-- Tipografía: Geist (UI), Geist Mono (metadatos), Instrument Serif (títulos y cifras principales) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif&display=swap" rel="stylesheet">

  <!-- Estilos Maestros -->
  <!-- ?v=__BUILD__ lo reemplaza el deploy por el commit: cada publicación obliga al navegador a bajar los archivos nuevos -->
  <link rel="stylesheet" href="MAESTRO.css?v=__BUILD__">

  <!-- React 18 y Babel Standalone para transpilar JSX en el navegador -->
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.4/babel.min.js"></script>

  <!-- Esqueleto de carga con la forma del tablero -->
  <style>
    .boot { max-width: 1120px; margin: 0 auto; }
    .sk { background: var(--border); border-radius: 8px; animation: sk 1.4s ease-in-out infinite; }
    .sk-grid { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 12px; margin: 28px 0 20px; }
    @keyframes sk { 50% { opacity: .45; } }
    @media (prefers-reduced-motion: reduce) { .sk { animation: none; } }
  </style>
</head>
<body>
  <!-- Contenedor Raíz de React -->
  <div id="root">
    <div class="boot" aria-busy="true" aria-label="Cargando portafolio">
      <div class="sk" style="width: 240px; height: 34px;"></div>
      <div class="sk" style="width: 320px; height: 12px; margin-top: 10px;"></div>
      <div class="sk-grid">
        <div class="sk" style="height: 220px;"></div>
        <div class="sk" style="height: 220px;"></div>
        <div class="sk" style="height: 220px;"></div>
      </div>
      <div class="sk" style="height: 320px;"></div>
    </div>
  </div>

  <!-- 1. Motor Maestro de Datos y Cálculos Financieros -->
  <script src="MAESTRO.js?v=__BUILD__"></script>

  <!-- 2. Aplicación Maestra en React (JSX) -->
  <script type="text/babel" src="MAESTRO.jsx?v=__BUILD__"></script>

  <!-- Aviso si se abre con file:// (el navegador bloquea la carga de MAESTRO.jsx) -->
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        const root = document.getElementById('root');
        if (root && root.querySelector('.boot') && window.location.protocol === 'file:') {
          root.innerHTML = `
            <div class="card" style="max-width: 560px; margin: 80px auto; padding: 28px;">
              <h2 class="section-title" style="margin-bottom: 8px;">Abre el sitio con un servidor local</h2>
              <p class="note" style="margin: 0 0 14px;">El navegador bloquea la carga de <code>MAESTRO.jsx</code> desde <code>file://</code>. En la carpeta del proyecto ejecuta:</p>
              <pre style="background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; padding: 10px 14px; margin: 0; font-family: var(--font-mono);">npx serve .</pre>
            </div>
          `;
        }
      }, 2500);
    });
  </script>
</body>
</html>
