<!doctype html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HAPI · Portafolio</title>
  <meta name="description" content="Resumen de inversiones en bolsa (Apex/HAPI) y crypto (Bakkt) a partir de los estados de cuenta mensuales.">
  <meta name="theme-color" content="#0b0c0e">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <!-- Tema guardado antes de pintar (evita parpadeo claro/oscuro) -->
  <script>
    try { document.documentElement.setAttribute('data-theme', localStorage.getItem('hapi_theme') || 'dark'); } catch (e) {}
  </script>

  <!-- Tipografía -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Estilos Maestros -->
  <link rel="stylesheet" href="MAESTRO.css">

  <!-- React 18 y Babel Standalone para transpilar JSX en el navegador -->
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.4/babel.min.js"></script>
</head>
<body>
  <!-- Contenedor Raíz de React -->
  <div id="root">
    <div class="boot" style="min-height: 70vh; display: flex; align-items: center; justify-content: center; gap: 10px; color: #9a9ca3; font: 14px 'Inter', system-ui, sans-serif;">
      <div class="spin" style="width: 16px; height: 16px; border: 2px solid rgba(154,156,163,.3); border-top-color: #9a9ca3; border-radius: 50%;"></div>
      Cargando portafolio…
    </div>
  </div>

  <!-- 1. Motor Maestro de Datos y Cálculos Financieros -->
  <script src="MAESTRO.js"></script>

  <!-- 2. Aplicación Maestra en React (JSX) -->
  <script type="text/babel" src="MAESTRO.jsx"></script>

  <!-- Aviso si se abre con file:// (el navegador bloquea la carga de MAESTRO.jsx) -->
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        const root = document.getElementById('root');
        if (root && root.querySelector('.boot') && window.location.protocol === 'file:') {
          root.innerHTML = `
            <div style="max-width: 560px; margin: 80px auto; padding: 24px; background: #121316; border: 1px solid #23252b; border-radius: 10px; color: #ececee; font: 14px/1.6 'Inter', system-ui, sans-serif;">
              <h2 style="font-size: 16px; font-weight: 600; margin: 0 0 8px;">Abre el sitio con un servidor local</h2>
              <p style="color: #9a9ca3; margin: 0 0 14px;">El navegador bloquea la carga de <code>MAESTRO.jsx</code> desde <code>file://</code>. En la carpeta del proyecto ejecuta:</p>
              <pre style="background: #0b0c0e; border: 1px solid #23252b; border-radius: 6px; padding: 10px 14px; margin: 0; color: #8ab4ff;">npx serve .</pre>
            </div>
          `;
        }
      }, 2500);
    });
  </script>
</body>
</html>
